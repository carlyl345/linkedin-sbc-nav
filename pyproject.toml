[project]
name = "linkedin-sales-tracker"
version = "0.1.0"
description = "Personal MCP server that tracks a LinkedIn selling-by-chat pipeline"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "anthropic>=2.14",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2",
  "google-api-python-client>=2.100",
  "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
