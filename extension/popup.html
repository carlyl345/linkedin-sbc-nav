<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.4 system-ui, sans-serif; width: 280px; margin: 12px; color: #1d1d1f; }
  button { width: 100%; padding: 8px; font-size: 14px; border: 0; border-radius: 6px;
           background: #0a66c2; color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #status { margin-top: 10px; min-height: 1.4em; }
  .ok { color: #057642; } .err { color: #b3261e; }
  details { margin-top: 12px; color: #555; }
  label { display: block; margin-top: 6px; }
  input { width: 100%; box-sizing: border-box; padding: 4px; }
  #save { margin-top: 8px; background: #555; padding: 5px; font-size: 12px; }
</style>
</head>
<body>
  <button id="capture">Log this conversation</button>
  <div id="status"></div>
  <details id="settings">
    <summary>Settings</summary>
    <label>Contact id (only if the tracker asks which person)
      <input id="contact" placeholder="leave empty normally"></label>
    <label>Shared secret <input id="secret" type="password"></label>
    <label>Port <input id="port" type="number" value="8765"></label>
    <button id="save">Save</button>
  </details>
  <script src="popup.js"></script>
</body>
</html>
